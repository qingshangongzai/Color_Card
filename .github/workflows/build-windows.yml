name: 构建 Windows 应用（Nuitka）

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-portable:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # 完整历史，保证 git rev-list --count 构建号准确
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Restore pip cache
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Restore Nuitka ccache
      id: cache-nuitka-portable
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/_nuitka_cache
        key: ${{ runner.os }}-nuitka-ccache-v1-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-nuitka-ccache-v1-

    - name: Install ccache
      shell: pwsh
      run: |
        choco install ccache --no-progress -y
        $ccachePath = (Get-Command ccache -ErrorAction SilentlyContinue).Source
        if ($ccachePath) {
          Write-Host "ccache 已安装: $ccachePath"
          "NUITKA_CCACHE_BINARY=$ccachePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        } else {
          Write-Host "::warning::ccache 安装失败，编译将不回退到无缓存模式"
        }

    - name: Configure Nuitka cache directories
      shell: pwsh
      run: |
        $cacheBase = "${{ github.workspace }}/_nuitka_cache"
        "NUITKA_CACHE_DIR=$cacheBase" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "NUITKA_CACHE_DIR_CCACHE=$cacheBase/ccache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "CCACHE_DIR=$cacheBase/ccache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        New-Item -ItemType Directory -Force -Path "$cacheBase/ccache" | Out-Null
        Write-Host "缓存基础目录: $cacheBase"
        Write-Host "缓存命中状态: ${{ steps.cache-nuitka-portable.outputs.cache-hit }}"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka
        pip install -r requirements.txt

    - name: Read version
      id: version
      shell: pwsh
      run: |
        $lines = Get-Content version.txt
        $VERSION = $lines[0].Trim()
        $FILE_VERSION = $lines[1].Trim()
        $PRODUCT_VERSION = $lines[2].Trim()
        $COMPANY_NAME = $lines[3].Trim()
        $COPYRIGHT = $lines[4].Trim()
        $APP_NAME = $lines[5].Trim()

        Write-Host "Debug: version content is: '$VERSION'"

        Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$VERSION"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "file_version=$FILE_VERSION"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "product_version=$PRODUCT_VERSION"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "company_name=$COMPANY_NAME"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "copyright=$COPYRIGHT"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "app_name=$APP_NAME"

    - name: Generate build info
      shell: pwsh
      run: |
        $buildNumber = git rev-list --count HEAD
        $commitSha = git rev-parse --short=8 HEAD
        Write-Host "Build number: $buildNumber, commit: $commitSha"
        Set-Content -Path build_info.py -Value "BUILD_NUMBER = `"$buildNumber`""
        Add-Content -Path build_info.py -Value "COMMIT_SHA = `"$commitSha`""

    - name: Build Portable Launcher
      shell: pwsh
      run: |
        pwsh -File launcher/build.ps1 -OutputPath "Color Card.exe"

    - name: Build Portable EXE with Nuitka
      shell: pwsh
      run: |
        python -m nuitka `
          --standalone `
          --assume-yes-for-downloads `
          --windows-console-mode=disable `
          --windows-icon-from-ico="logo/Color Card_logo.ico" `
          --company-name="${{ steps.version.outputs.company_name }}" `
          --product-name="${{ steps.version.outputs.app_name }}" `
          --file-version="${{ steps.version.outputs.file_version }}" `
          --product-version="${{ steps.version.outputs.product_version }}" `
          --file-description="取色卡 - Color Card" `
          --copyright="${{ steps.version.outputs.copyright }}" `
          --include-data-files=version.py=version.py `
          --include-data-dir=color_data=color_data `
          --include-data-dir=file=file `
          --include-data-dir=locales=locales `
          --include-data-files="logo/Color Card_logo.ico=logo/Color Card_logo.ico" `
          --include-data-files="logo/Color Card_logo.png=logo/Color Card_logo.png" `
          --include-data-dir=scenes_data=scenes_data `
          --nofollow-import-to=PIL.AvifImagePlugin `
          --nofollow-import-to=PIL.WebPImagePlugin `
          --python-flag=no_docstrings `
          --noinclude-qt-plugins=tls `
          --noinclude-dlls=qt6pdf.dll `
          --enable-plugin=pyside6 `
          --jobs=4 `
          --output-filename="Color Card" `
          main.py

    - name: Create distribution folder
      shell: pwsh
      run: |
        $distDir = "dist"
        $appDir = "$distDir\app"
        New-Item -ItemType Directory -Force -Path $appDir | Out-Null

        $version = "${{ steps.version.outputs.version }}"
        $zipName = "Color_Card_${version}_win_x64.zip"
        $zipPath = Join-Path $env:RUNNER_TEMP $zipName

        # 根目录只放启动器与 config，主程序与运行库整体进 app/
        Copy-Item "main.dist\*" -Destination $appDir -Recurse
        Copy-Item "Color Card.exe" -Destination $distDir
        # .portable 须与 app_mode.PORTABLE_LAYOUT_MARKER 保持一致，应用据此把 config 放到解压根目录
        New-Item -ItemType File -Force -Path "$appDir\.portable" | Out-Null

        # --noinclude-dlls 对 Qt 插件 DLL 不生效，这里显式剔除 UI 不可达的图片格式与平台插件
        $unusedQtPlugins = @(
          "app\PySide6\qt-plugins\imageformats\qpdf.dll",
          "app\PySide6\qt-plugins\imageformats\qtiff.dll",
          "app\PySide6\qt-plugins\imageformats\qicns.dll",
          "app\PySide6\qt-plugins\imageformats\qtga.dll",
          "app\PySide6\qt-plugins\imageformats\qwbmp.dll",
          "app\PySide6\qt-plugins\imageformats\qwebp.dll",
          "app\PySide6\qt-plugins\platforms\qdirect2d.dll"
        )
        foreach ($plugin in $unusedQtPlugins) {
          $pluginPath = Join-Path $distDir $plugin
          if (Test-Path $pluginPath) {
            Remove-Item $pluginPath -Force
          }
        }

        # Compress-Archive 压缩级别固定且偏弱，改用 zipfile level 9（同目录实测省约 2 MB）
        $zipScript = Join-Path $env:RUNNER_TEMP "make_zip.py"
        @'
        import os
        import sys
        import zipfile

        src, dst = sys.argv[1], sys.argv[2]
        with zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
            for root, _dirs, files in os.walk(src):
                for name in files:
                    path = os.path.join(root, name)
                    archive.write(path, os.path.relpath(path, src))
        '@ | Set-Content -Path $zipScript -Encoding utf8
        python $zipScript $distDir $zipPath
        Move-Item $zipPath "$distDir\$zipName"

        Write-Host "Portable distribution contents:"
        Get-ChildItem -Path $distDir

    - name: Upload portable artifact
      uses: actions/upload-artifact@v4
      with:
        name: ColorCard-Windows-Portable
        path: dist/*.zip

  build-installer:
    # 载荷复用便携 job 产物 zip，两条产物线共用一次 onedir 编译
    needs: build-portable
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # 完整历史，保证 git rev-list --count 构建号准确
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Restore pip cache
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Restore Nuitka ccache
      id: cache-nuitka-installer
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/_nuitka_cache
        key: ${{ runner.os }}-nuitka-ccache-v1-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-nuitka-ccache-v1-

    - name: Install ccache
      shell: pwsh
      run: |
        choco install ccache --no-progress -y
        $ccachePath = (Get-Command ccache -ErrorAction SilentlyContinue).Source
        if ($ccachePath) {
          Write-Host "ccache 已安装: $ccachePath"
          "NUITKA_CCACHE_BINARY=$ccachePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        } else {
          Write-Host "::warning::ccache 安装失败，编译将回退到无缓存模式"
        }

    - name: Configure Nuitka cache directories
      shell: pwsh
      run: |
        $cacheBase = "${{ github.workspace }}/_nuitka_cache"
        "NUITKA_CACHE_DIR=$cacheBase" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "NUITKA_CACHE_DIR_CCACHE=$cacheBase/ccache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "CCACHE_DIR=$cacheBase/ccache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        New-Item -ItemType Directory -Force -Path "$cacheBase/ccache" | Out-Null
        Write-Host "缓存基础目录: $cacheBase"
        Write-Host "缓存命中状态: ${{ steps.cache-nuitka-installer.outputs.cache-hit }}"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka[onefile]
        pip install -r requirements.txt

    - name: Read version
      id: version
      shell: pwsh
      run: |
        $lines = Get-Content version.txt
        $VERSION = $lines[0].Trim()
        $FILE_VERSION = $lines[1].Trim()
        $PRODUCT_VERSION = $lines[2].Trim()
        $COMPANY_NAME = $lines[3].Trim()
        $COPYRIGHT = $lines[4].Trim()
        $APP_NAME = $lines[5].Trim()

        Write-Host "Debug: version content is: '$VERSION'"

        Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$VERSION"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "file_version=$FILE_VERSION"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "product_version=$PRODUCT_VERSION"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "company_name=$COMPANY_NAME"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "copyright=$COPYRIGHT"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "app_name=$APP_NAME"

    - name: Generate build info
      shell: pwsh
      run: |
        $buildNumber = git rev-list --count HEAD
        $commitSha = git rev-parse --short=8 HEAD
        Write-Host "Build number: $buildNumber, commit: $commitSha"
        Set-Content -Path build_info.py -Value "BUILD_NUMBER = `"$buildNumber`""
        Add-Content -Path build_info.py -Value "COMMIT_SHA = `"$commitSha`""

    - name: Download portable payload
      uses: actions/download-artifact@v4
      with:
        name: ColorCard-Windows-Portable

    - name: Prepare installer payload
      shell: pwsh
      run: |
        # 便携产物 zip 文件名含版本号与空格，通配定位；目标名须与 installer/core/install_service.py 的 PAYLOAD_ZIP_NAME 一致
        $payloadSource = Get-ChildItem -Filter "Color_Card_*_win_x64.zip" | Select-Object -First 1
        if (-not $payloadSource) {
          throw "未找到便携载荷 zip（预期匹配 Color_Card_*_win_x64.zip）"
        }
        # 载荷重压为 LZMA：实测较 deflate-9 省 ~15 MB。Windows Explorer 不支持 LZMA，便携 zip 保持 deflate，仅安装器内嵌载荷重压（内容零加工，条目集合不变）
        $rezipScript = Join-Path $env:RUNNER_TEMP "rezip_payload.py"
        @'
        import shutil
        import sys
        import zipfile

        src, dst = sys.argv[1], sys.argv[2]
        with zipfile.ZipFile(src) as archive_in, zipfile.ZipFile(dst, "w", zipfile.ZIP_LZMA) as archive_out:
            for info in archive_in.infolist():
                if info.is_dir():
                    continue
                with archive_in.open(info) as member_in, archive_out.open(info.filename, "w") as member_out:
                    shutil.copyfileobj(member_in, member_out)
        '@ | Set-Content -Path $rezipScript -Encoding utf8
        python $rezipScript $payloadSource.FullName "Color Card Payload.zip"
        if ($LASTEXITCODE -ne 0) {
          throw "载荷重压失败（python 退出码 $LASTEXITCODE）"
        }
        Write-Host "载荷已就位(重压 LZMA): $($payloadSource.Name) -> Color Card Payload.zip"

    - name: Build Installer EXE with Nuitka
      shell: pwsh
      run: |
        # 数据目录由载荷 zip 自带（安装时解压铺开），向导自身仅需 logo ico 与载荷文件；
        # ui 不入产物——installer 零 ui 导入，core 内 ui 引用均为函数级且安装器运行期不触达；
        # onefile 无法在打包后清理文件，仅用实测对 Qt 插件生效的 noinclude 参数（tls 插件、qt6pdf.dll）
        python -m nuitka `
          --standalone `
          --onefile `
          --assume-yes-for-downloads `
          --windows-console-mode=disable `
          --windows-icon-from-ico="logo/Color Card_logo.ico" `
          --company-name="${{ steps.version.outputs.company_name }}" `
          --product-name="${{ steps.version.outputs.app_name }}" `
          --file-version="${{ steps.version.outputs.file_version }}" `
          --product-version="${{ steps.version.outputs.product_version }}" `
          --file-description="取色卡 - Color Card (Installer)" `
          --copyright="${{ steps.version.outputs.copyright }}" `
          --include-data-files=version.py=version.py `
          --include-data-files="logo/Color Card_logo.ico=logo/Color Card_logo.ico" `
          --include-data-files="Color Card Payload.zip=Color Card Payload.zip" `
          --nofollow-import-to=ui `
          --nofollow-import-to=PIL.AvifImagePlugin `
          --nofollow-import-to=PIL.WebPImagePlugin `
          --noinclude-qt-plugins=tls `
          --noinclude-dlls=qt6pdf.dll `
          --python-flag=no_docstrings `
          --enable-plugin=pyside6 `
          --jobs=4 `
          --output-filename="ColorCard" `
          installer_main.py

    - name: Create distribution folder
      shell: pwsh
      run: |
        $distDir = "dist"
        New-Item -ItemType Directory -Force -Path $distDir

        $version = "${{ steps.version.outputs.version }}"
        $installerName = "Color_Card_${version}_win_x64_Setup.exe"

        Copy-Item "ColorCard.exe" -Destination "$distDir\$installerName"

        Write-Host "Installer distribution contents:"
        Get-ChildItem -Path $distDir

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: ColorCard-Windows-Installer
        path: dist/*.exe
